[project]
name = "maintenance-ml"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141,<1",
  "joblib>=1.4,<2",
  "mlflow-skinny>=3.10,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "skops>=0.10,<1",
  "uvicorn>=0.35,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mlflow>=3.10,<4",
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
